name: media_organizer
description: >-
  MediaOrganizer 媒体文件整理器（Flutter 版）。从照片/视频中提取拍摄日期，
  按 年/月/日 分级目录复制或移动到本地或网络目标，并提供失败文件管理与分析报告。
  界面与功能对应 docs/android-界面原型设计 与 docs/SRS-Android.md。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 图片 EXIF 解析（纯 Dart；JPEG/TIFF 覆盖最好，HEIC/PNG 受限则由文件名提取器兜底）
  exif: ^3.3.0
  # 目录选取（Android SAF / 桌面系统对话框）与报告另存为
  file_picker: ^8.1.2
  # 应用专有数据目录（config.json / patterns.json / analysis-result.json）
  path_provider: ^2.1.4
  # 分析报告分享（系统分享面板 / 桌面降级）
  share_plus: ^10.0.0
  # 失败文件「用系统应用打开」
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
