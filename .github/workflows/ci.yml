name: ci

# 编译校验流水线：每次 push / PR 到 main 都验证桌面端与安卓端能否编译通过。
# 与 release.yml 的区别：不签名、不打包安装包、不发布 Release，因此不需要任何 secrets，
# 适合在改完平台代码后快速验证云端能否构建（本机不装 Android SDK 时尤其有用）。
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android (net10.0-android, arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install android

      # 只编译不签名：验证 C# 平台代码（SAF/前台服务/Mono.Android API 名称）能否通过编译。
      # 注意 -f 只能对单个 csproj 使用，不能作用于 slnx（会把其他项目强按 android 目标 → NETSDK1005）。
      - name: Build Android project
        shell: pwsh
        run: >
          dotnet build src/MediaOrganizer.Android/MediaOrganizer.Android.csproj
          -c Release -f net10.0-android

      # 光编译通过不能证明 [Service(ForegroundServiceType=…)] 真的落进清单：
      # Android 14+ 若 service 未声明合法 foregroundServiceType，startForeground 会抛
      # MissingForegroundServiceTypeException / InvalidForegroundServiceTypeException（装到真机才炸）。
      # 这里对合并后的清单做断言，把这类「编译过、运行崩」的问题挡在 CI。
      - name: Assert merged AndroidManifest (dataSync 前台服务已声明)
        shell: pwsh
        run: |
          $manifest = Get-ChildItem src/MediaOrganizer.Android/obj -Recurse -Filter AndroidManifest.xml |
                      Where-Object { $_.FullName -replace '\\','/' -match '/net10\.0-android(/android)?/AndroidManifest\.xml$' } |
                      Sort-Object { if ($_.FullName -match '/android/') { 0 } else { 1 } } |
                      Select-Object -First 1
          if (-not $manifest) { throw "未找到合并后的 AndroidManifest.xml（obj/**/net10.0-android/）" }
          Write-Host "merged manifest: $($manifest.FullName)"
          $text = Get-Content $manifest.FullName -Raw
          # 打印全部 <service> 行，便于诊断
          $text -split "`n" | Where-Object { $_ -match '<service\b' } | ForEach-Object { Write-Host "service: $($_.Trim())" }
          # [Service] 显式 Name="org.mediaorganizer.android.organize"，清单里不含类名；
          # 同时兼容未显式命名时 .NET Android 生成 crc64xxxx.OrganizeForegroundService 的形态
          if ($text -notmatch 'OrganizeForegroundService' -and $text -notmatch 'org\.mediaorganizer\.android\.organize') { throw "清单中缺少 OrganizeForegroundService 的 <service> 条目" }
          if ($text -notmatch 'android:foregroundServiceType="dataSync"') { throw "service 未声明 foregroundServiceType=dataSync" }
          if ($text -notmatch 'FOREGROUND_SERVICE_DATA_SYNC') { throw "缺少 FOREGROUND_SERVICE_DATA_SYNC 权限" }
          if ($text -notmatch 'POST_NOTIFICATIONS') { throw "缺少 POST_NOTIFICATIONS 权限" }
          Write-Host "OK: dataSync 前台服务与相关权限均已声明"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaOrganizer-android-unsigned
          path: src/MediaOrganizer.Android/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error

  build-desktop:
    name: Desktop (net10.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Desktop project
        shell: pwsh
        run: dotnet build src/MediaOrganizer.Desktop/MediaOrganizer.Desktop.csproj -c Release

  test-core:
    name: Core unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        shell: pwsh
        run: dotnet test test/MediaOrganizer.Core.Tests/MediaOrganizer.Core.Tests.csproj -c Release
