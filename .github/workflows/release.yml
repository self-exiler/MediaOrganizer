name: release

# 既定发布管线（技能约定：本地构建脚本与云端共用同一入口，发布完全由 v* 标签驱动）：
# ① 推送 v* 标签 → 云端编译 → 构建成功才创建 GitHub Release 并附产物；
# ② 手动 workflow_dispatch（填版本号）→ 仅编译 + 上传 Actions 产物，不创建 Release（验证管线/临时出包）。
# 快速编译验证（不签名、不需要 secrets）请用 ci.yml。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.2.0，不带 v 前缀）"
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 拉全量历史,versionCode 用 git rev-list --count 计算
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号：tag 触发 → tag 名剥掉前导 v（startsWith 是文档保证的函数名，别写小写）；
      # 手动触发 → inputs.version。versionCode(Android ApplicationVersion,必须单调递增)
      # 用提交数自动生成,与仓库历史绑定,天然单调,发版零人肉。csproj 里的值仅作本地构建兜底。
      - name: Resolve version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}".TrimStart('v', 'V') }
          if ([string]::IsNullOrWhiteSpace($v)) { throw "版本号解析为空" }
          $code = [int](git rev-list --count HEAD)
          if ($code -lt 2) { throw "versionCode 异常: $code" }
          Write-Host "APP_VERSION = $v"
          Write-Host "VERSION_CODE = $code"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$v"
          Add-Content $env:GITHUB_ENV "VERSION_CODE=$code"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install android

      # ---------- 桌面版 ----------
      - name: Publish desktop (self-contained + ReadyToRun)
        shell: pwsh
        run: ./packaging/publish.ps1 -OutputDir packaging/publish/win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        env:
          ISCC: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
        run: '"%ISCC%" /DMyAppVersion=${{ env.APP_VERSION }} packaging/MediaOrganizer.iss'

      # ---------- 安卓版 ----------
      - name: Restore Android keystore from secrets
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force keystore | Out-Null
          [IO.File]::WriteAllBytes('keystore/mediaorganizer-release.jks',
            [Convert]::FromBase64String($env:KEYSTORE_B64))

      - name: Publish Android APK (arm64, signed)
        shell: pwsh
        run: >
          dotnet publish src/MediaOrganizer.Android/MediaOrganizer.Android.csproj
          -c Release -f net10.0-android
          -p:ApplicationDisplayVersion=${{ env.APP_VERSION }}
          -p:ApplicationVersion=${{ env.VERSION_CODE }}
          -p:AndroidSigningKeyStore=${{ github.workspace }}\keystore\mediaorganizer-release.jks
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEYSTORE_PASS }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem packaging/releases/*.exe | Select-Object -First 1
          $apk   = Get-ChildItem src/MediaOrganizer.Android/*-Signed.apk -Recurse |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "未找到桌面安装包" }
          if (-not $apk)   { throw "未找到签名 APK" }
          Add-Content $env:GITHUB_OUTPUT "setup=$($setup.FullName)"
          Add-Content $env:GITHUB_OUTPUT "apk=$($apk.FullName)"

      # 每次运行都上传 Actions 产物：验证管线取包、失败排障（glob 保持宽松，产物改名不动工作流）
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          # 命名约定：程序名-操作系统-cpu架构-版本号
          name: MediaOrganizer-windows-x64-${{ env.APP_VERSION }}
          path: packaging/releases/*.exe
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaOrganizer-android-arm64-${{ env.APP_VERSION }}
          path: src/MediaOrganizer.Android/**/*-Signed.apk
          if-no-files-found: error

      # 仅 tag 触发创建 Release，且排在构建、产物上传之后——构建失败就不会出现不完整的 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/releases/*.exe
            src/MediaOrganizer.Android/**/*-Signed.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
