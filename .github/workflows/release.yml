name: release

# 既定发布管线（技能约定：本地构建脚本与云端共用同一入口，发布完全由 v* 标签驱动）：
# ① 推送 v* 标签 → 云端编译 → 构建成功才创建 GitHub Release 并附产物；
# ② 手动 workflow_dispatch（填版本号）→ 仅编译 + 上传 Actions 产物，不创建 Release（验证管线/临时出包）。
# 快速编译验证（不签名、不需要 secrets）请用 ci.yml。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.2.0，不带 v 前缀）"
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 拉全量历史,versionCode 用 git rev-list --count 计算
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号：tag 触发 → tag 名剥掉前导 v（startsWith 是文档保证的函数名，别写小写）；
      # 手动触发 → inputs.version。versionCode(Android ApplicationVersion,必须单调递增)
      # 用提交数自动生成,与仓库历史绑定,天然单调,发版零人肉。csproj 里的值仅作本地构建兜底。
      - name: Resolve version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "${{ github.ref_name }}".TrimStart('v', 'V') }
          if ([string]::IsNullOrWhiteSpace($v)) { throw "版本号解析为空" }
          $code = [int](git rev-list --count HEAD)
          if ($code -lt 2) { throw "versionCode 异常: $code" }
          Write-Host "APP_VERSION = $v"
          Write-Host "VERSION_CODE = $code"
          Add-Content $env:GITHUB_ENV "APP_VERSION=$v"
          Add-Content $env:GITHUB_ENV "VERSION_CODE=$code"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install android

      # ---------- 桌面版 ----------
      - name: Publish desktop (Native AOT)
        shell: pwsh
        run: ./packaging/publish.ps1 -OutputDir packaging/publish/win-x64

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 工具与扩展都钉死版本：CI 与本地 build-installer.ps1 用同一套 WiX v5，避免版本漂移。
          # 幂等写法：重复安装、镜像预装都不会让这一步失败。
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) {
            dotnet tool install --global wix --version 5.0.2
          }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          # 全局工具目录不一定在 PATH 上，显式补进去，后续步骤才能直接调用 wix
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          wix --version

      # APP_VERSION 由前面 Resolve version 步骤写入 GITHUB_ENV，pwsh 里取 $env:APP_VERSION
      - name: Build MSI installer
        shell: pwsh
        run: ./packaging/build-installer.ps1 -Version $env:APP_VERSION -PublishDir packaging/publish/win-x64 -OutputDir packaging/releases

      # ---------- 安卓版 ----------
      - name: Restore Android keystore from secrets
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force keystore | Out-Null
          [IO.File]::WriteAllBytes('keystore/mediaorganizer-release.jks',
            [Convert]::FromBase64String($env:KEYSTORE_B64))

      - name: Publish Android APK (arm64, signed)
        shell: pwsh
        run: >
          dotnet publish src/MediaOrganizer.Android/MediaOrganizer.Android.csproj
          -c Release -f net10.0-android
          -p:ApplicationDisplayVersion=${{ env.APP_VERSION }}
          -p:ApplicationVersion=${{ env.VERSION_CODE }}
          -p:AndroidSigningKeyStore=${{ github.workspace }}\keystore\mediaorganizer-release.jks
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEYSTORE_PASS }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem packaging/releases/*.msi | Select-Object -First 1
          $apk   = Get-ChildItem src/MediaOrganizer.Android/*-Signed.apk -Recurse |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "未找到桌面安装包" }
          if (-not $apk)   { throw "未找到签名 APK" }

          # 文件名必须与本次版本号完全一致。build-installer.ps1 在 -Version 取到空值时会
          # 静默回退到 csproj 兜底版本，那样 tag 与产物版本会错位；文件名与 MSI 内的
          # ProductVersion 同源（都来自同一个 $Version），断言文件名即可挡住这类漂移。
          $expectName = "MediaOrganizer-windows-x64-$env:APP_VERSION.msi"
          if ($setup.Name -ne $expectName) {
            throw "桌面安装包版本号不符：期望 $expectName，实际 $($setup.Name)"
          }
          Write-Host "MSI 版本校验通过：$expectName"

          # APK 按命名约定重命名（程序名-操作系统-cpu架构-版本号，与 MSI 产物同规则）。
          # .NET Android 默认输出 org.mediaorganizer.android-Signed.apk（单 RID android-arm64）。
          $apkNamed = "packaging/releases/MediaOrganizer-android-arm64-$env:APP_VERSION.apk"
          Copy-Item $apk.FullName $apkNamed -Force
          Write-Host "APK 重命名: $($apk.Name) -> $(Split-Path -Leaf $apkNamed)"

          Add-Content $env:GITHUB_OUTPUT "setup=$($setup.FullName)"
          Add-Content $env:GITHUB_OUTPUT "apk=$apkNamed"

      # 每次运行都上传 Actions 产物：验证管线取包、失败排障（glob 保持宽松，产物改名不动工作流）
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          # 命名约定：程序名-操作系统-cpu架构-版本号
          name: MediaOrganizer-windows-x64-${{ env.APP_VERSION }}
          # 只收 .msi：wix build 会顺带产出同名 .wixpdb（符号/补丁元数据），不应对外分发
          path: packaging/releases/*.msi
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaOrganizer-android-arm64-${{ env.APP_VERSION }}
          path: packaging/releases/MediaOrganizer-android-arm64-*.apk
          if-no-files-found: error

      # r8（AndroidLinkTool）会混淆 Java 侧栈帧，还原崩溃栈必须靠 publish 目录下的 mapping.txt。
      # 只进 Actions 产物、不进公开 Release：映射表相当于把代码结构反还给外人，排障够用即可。
      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaOrganizer-android-arm64-${{ env.APP_VERSION }}-mapping
          path: src/MediaOrganizer.Android/**/mapping.txt
          if-no-files-found: ignore

      # 仅 tag 触发创建 Release，且排在构建、产物上传之后——构建失败就不会出现不完整的 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/releases/*.msi
            packaging/releases/MediaOrganizer-android-arm64-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
