<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 单色版（默认深色，用于浅色任务栏；深色任务栏可用 CSS filter:invert(1) 反色） -->
  <g fill="#1E293B">
    <!-- 背景卡片轮廓 -->
    <g transform="rotate(-8 14 18)">
      <rect x="7" y="9" width="16" height="18" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
    </g>
    <!-- 主卡片 -->
    <rect x="9" y="5" width="16" height="20" rx="2.5" fill="none" stroke="#1E293B" stroke-width="1.75"/>
    <!-- 照片内容区 -->
    <rect x="11" y="7" width="12" height="10" rx="1" fill="#1E293B"/>
    <!-- 太阳（镂空） -->
    <circle cx="20" cy="11" r="1.6" fill="#FFFFFF"/>
    <!-- 山脉（镂空） -->
    <path d="M 11 17 L 15 13 L 18 15 L 21 12 L 23 17 Z" fill="#FFFFFF"/>
  </g>
</svg>
