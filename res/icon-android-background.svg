<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- 与桌面底板一致的蓝青渐变 -->
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- 全填充背景（自适应图标背景层，会被各种形状裁剪） -->
  <rect width="108" height="108" fill="url(#abg)"/>
  <!-- 低透明度装饰光斑，增加层次但不喧宾夺主 -->
  <circle cx="18" cy="18" r="32" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="92" cy="94" r="38" fill="#FFFFFF" opacity="0.06"/>
</svg>
